# ConfigMap = non-secret config, injected as env vars.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-api
  namespace: notes
data:
  DB_HOST: postgres
  DB_NAME: notes
  DB_USER: notes
---
# Deployment = "keep N identical, stateless pods running". If a pod dies, it makes a new one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: notes
  labels:
    app: notes-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-api          # must match the pod template labels below
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      containers:
        - name: notes-api
          image: notes-api:0.1.0
          imagePullPolicy: IfNotPresent   # image is imported into k3d, not pulled from a registry
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: notes-api
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notes-db
                  key: POSTGRES_PASSWORD
          livenessProbe:            # fails -> container is restarted
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:           # fails -> pod removed from Service, NOT restarted
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }
---
# Service load-balances across all ready notes-api pods.
apiVersion: v1
kind: Service
metadata:
  name: notes-api
  namespace: notes
  labels:
    app: notes-api
spec:
  selector:
    app: notes-api
  ports:
    - name: http
      port: 80
      targetPort: http
