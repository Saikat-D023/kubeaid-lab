apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets   # a Helm chart repo, not Git
    chart: sealed-secrets
    targetRevision: "2.*"                                   # any 2.x chart version
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller          # the name kubeseal looks for
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system