apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Saikat-D023/kubeaid-lab.git
    targetRevision: main
    path: kubeaid-config/k8s/lab/notes          # your app's manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: notes